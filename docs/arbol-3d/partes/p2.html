function makeRock(seed){
  const g=new THREE.SphereGeometry(1,22,14),p=g.attributes.position,cols=[],cc=new THREE.Color();
  for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const k=1+(vnoise(x*1.3+seed,z*1.3+y)-.5)*.22;x*=k*1.1;y*=k*0.62;z*=k;if(y<-0.28)y=-0.28;p.setXYZ(i,x,y,z)}
  g.computeVertexNormals();
  const base=new THREE.Color().setHSL(0.09+((seed*7)%5)*0.008,0.12,0.6);
  for(let i=0;i<p.count;i++){const y=p.getY(i);cc.copy(base).multiplyScalar(0.86+0.2*clamp((y+0.28)/0.9));cols.push(cc.r,cc.g,cc.b)}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));return g;
}

const bladeGeo=(function(){
  /* un mechón = 7 hojitas de punta redondeada que se abren hacia afuera */
  const T=[0,.3,.58,.8,.93,1],W=[1,1.08,.98,.74,.42,0],pos=[],col=[],nrm=[],rr=rng(12);
  for(let b=0;b<10;b++){const ang=b/10*6.283+rr()*0.6,ca=Math.cos(ang),sa=Math.sin(ang),lean=0.06+rr()*0.16,h=0.5+rr()*0.5,w=0.032;
    const P=function(t,s){const x=s*W[Math.round(t*0)]*0,o=lean*t*t*h*1.4;return [ca*o-sa*s,t*h,sa*o+ca*s]};
    const nx=ca*0.3,nz=sa*0.3;
    for(let k=0;k<T.length-1;k++){const t0=T[k],t1=T[k+1],w0=W[k]*w,w1=W[k+1]*w;
      const a=P(t0,-w0),bq=P(t0,w0),c=P(t1,w1),d=P(t1,-w1),c0=0.5+0.5*t0,c1=0.5+0.5*t1;
      [[a,c0],[bq,c0],[c,c1],[a,c0],[c,c1],[d,c1],[a,c0],[c,c1],[bq,c0],[a,c0],[d,c1],[c,c1]].forEach(function(q){pos.push(q[0][0],q[0][1],q[0][2]);col.push(q[1],q[1],q[1]);nrm.push(nx,0.9,nz)})}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));return g;
})();
