<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kiri Finance</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #1B4332; color: #f0fdf4; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    }
    .caja { max-width: 320px; }
    .logo { width: 72px; height: 72px; border-radius: 20px; background: #2D6A4F; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; opacity: .85; margin: 0 0 24px; }
    button { border: 0; border-radius: 14px; padding: 14px 28px; font-size: 15px; font-weight: 700; background: #95d5b2; color: #1B4332; }
  </style>
</head>
<body>
  <div class="caja">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d8f3dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>
    </div>
    <h1 id="t">Sin conexión</h1>
    <p id="d">Kiri necesita internet para mostrar tus finanzas al día. Revisa tu conexión e intenta de nuevo.</p>
    <button id="b" onclick="location.href = 'https://kiri.cyclonet.com.co/dashboard'">Reintentar</button>
  </div>
  <script>
    if ((navigator.language || 'es').toLowerCase().startsWith('en')) {
      document.getElementById('t').textContent = 'No connection'
      document.getElementById('d').textContent = 'Kiri needs internet to show your finances up to date. Check your connection and try again.'
      document.getElementById('b').textContent = 'Try again'
    }
  </script>
</body>
</html>
